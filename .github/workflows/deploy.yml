# Nom du workflow
name: 🚀 Déploiement Automatique sur InfinityFree (FTP)

# Événements déclencheurs
on:
  push:
    branches:
      - main # Le workflow s'exécute à chaque push sur la branche 'main'

# Jobs (tâches) à exécuter
jobs:
  deploy:
    # Exécuter le job sur un runner Ubuntu
    runs-on: ubuntu-latest
    
    # Étapes du job
    steps:
      # 1. Checkout du code
      - name:  checkout
        uses: actions/checkout@v4
        with:
          # Permet de récupérer l'historique complet pour les futures optimisations si nécessaire
          fetch-depth: 0

      # 2. (Optionnel) Étape de construction
      # Si votre site est statique (HTML/CSS/JS simples), vous pouvez sauter cette étape.
      # Si vous utilisez un framework comme React/Vue/Hugo, vous devez construire le site ici.
      # - name: Build Project (exemple pour un site construit avec Node)
      #   run: |
      #     npm install
      #     npm run build # La commande de construction de votre projet

      # 3. Déploiement FTP (l'étape cruciale)
      - name: Show files that will be deployed (debug)
        run: |
          pwd
          echo "Files in repo root:"
          ls -la
          echo "Top-level files and directories (recursive 2 levels):"
          find . -maxdepth 2 -type f | sed -n '1,200p'

      - name: FTP Deploy to InfinityFree
        # Utilisation de l'action très populaire 'SamKirkland/FTP-Deploy-Action'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          # Configuration de la connexion : utilisation des secrets GitHub !
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Le chemin d'accès au répertoire sur le serveur FTP (input correct: server-dir)
          server-dir: /htdocs/
          # Le répertoire local à téléverser (assurez-vous que c'est le dossier construit si vous avez une étape de build)
          local-dir: ./
          # Niveau de logs valide: minimal, standard, verbose
          log-level: verbose
          # Pour tester sans envoyer de fichiers, vous pouvez activer `dry-run: true`
          # Exclure certains fichiers/dossiers (input correct: 'exclude')
          # exclude: |
          #   **/.git*
          #   **/.github*
          #   **/node_modules
